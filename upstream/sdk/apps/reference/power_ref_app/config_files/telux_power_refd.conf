### Telux Power Reference Demon Setting ###

[TRIGGER]
# DISABLE - trigger will not be listening for an event
# ENABLE -  trigger will be listening for an event

NAOIP_TRIGGER = DISABLE
GPIO_TRIGGER = DISABLE
SMS_TRIGGER = ENABLE
CAN_TRIGGER = DISABLE

[CAN_TRIGGER]
# IDs for CAN frames for various system power states, such as SUSPEND, RESUME, and SHUTDOWN
# CAN frame IDs must be read in hexadecimal.
# To signal that it is an extended frame, the IDE bit of the CAN frame ID should be set to 1.
# If it is expected to perform power state change operations on individual machines available in the
# power framework, then the respective machine name can be provided in the CAN frame data.
# If no machine name is provided, the state transition is initiated on all machines.
TRIGGER_SUSPEND=0x80009997
TRIGGER_RESUME=0x80009998
TRIGGER_SHUTDOWN=0x80009999


[SMS_TRIGGER]
# The provided text on the right side will be considered a trigger for the respective state
# transition.
# For example, if TRIGGER_SUSPEND=LOW_POWER_MODE, an incoming SMS with text LOW_POWER_MODE will
# initiate the suspend transition.
# If power state change operations are to be performed on individual machines in the power
# framework, the machine name can be added in the message after the operation name, with the
# deliminator set to ":".
# E.g. SUSPEND:abc
#      An SMS with the above text will initiate suspend transition on machine "abc"
TRIGGER_SUSPEND=SUSPEND
TRIGGER_RESUME=RESUME
TRIGGER_SHUTDOWN=SHUTDOWN
# Slot ID on which the SMS trigger needs to be monitored
SLOT_ID=1

[NAOIP_TRIGGER]
# The provided text on the right side will be considered a trigger for the respective state
# transition.
# For example, if TRIGGER_SUSPEND=LOW_POWER_MODE, an incoming IP packet with text LOW_POWER_MODE
# will initiate the suspend transition.
# If power state change operations are to be performed on individual machines in the power
# framework, the machine name can be added in the message after the operation name, with the
# deliminator set to ":". 
# E.g. SUSPEND:abc
#      An IP packet with the above text will initiate suspend transition on machine "abc"
TRIGGER_SUSPEND=SUSPEND
TRIGGER_RESUME=RESUME
TRIGGER_SHUTDOWN=SHUTDOWN
# Data filter installation for NAOIP trigger
# allow the service to install the data filter on suspend and remove it on a resume.
NAOIP_FILTER_CONFIG_FILE=/etc/Datafilter.conf

[communication]
# For Application ROLE = CLIENT:
#   - It will use the client address from the data call started on the
#     specified profile and SIM, and a randomly assigned client port.
#   - The destination server address and port are mandatory to establish communication.
#
# For Application ROLE = SERVER:
#   - The server address used for listening will be derived from the started data call.
#   - The server port is mandatory to start listening.
ROLE=CLIENT

# Provide transport protocol such as TCP or UDP
TRANSPORT_PROTOCOL=TCP

# INSTALL_DATA_FILTER: Enables or disables the installation of data filters for communication
#                       sockets before suspend.
# - ENABLE: Install additional filter for configured socket connection under [communication]
#           along with filters configured in NAOIP_FILTER_CONFIG_FILE.
# - DISABLE: Before device suspend, don't install any additional filter other than
#            NAOIP_FILTER_CONFIG_FILE.
INSTALL_DATA_FILTER=ENABLE

# If the transport protocol is TCP, when the device is in suspend mode, to keep the TCP session
# active for a long time, sending keep-alive messages can be offloaded to the modem
# to avoid waking the device.
TCP_KEEP_ALIVE=ENABLE

# Keep-alive packet interval is in milliseconds and is expected to be greater than or equal to
# 60000.
TCP_KEEP_ALIVE_PACKET_INTERVAL=60000

# IP_FAMILY represents whether the IP connection is IPv4 (IP_FAMILY=4) or IPv6 (IP_FAMILY=6)
IP_FAMILY=4

# Start the data call on the profile specified below before establishing the IP connection.
# If not specified, the app will start the data call on the default SIM and profile.
#
# Single SIM:
# Example: START_DATA_CALL_ON_PROFILE_ID=1
# This means start the data call on SIM 1, profile 1.
#
# Multi-SIM:
# In case of multi-SIM, if a data call is expected on both SIMs, then the profile for
# SIM 2 must also be provided (comma-separated).
# Example: START_DATA_CALL_ON_PROFILE_ID=1,4
# This means use profile 1 for SIM 1 and profile 4 for SIM 2.
START_DATA_CALL_ON_PROFILE_ID=1

# Apps have been granted SELinux permission to use destination context `unreserved_port_t`.
# The unreserved port range is 1024–65535, but some ports within this range are assigned to other
# SELinux contexts, e.g., Hadoop DataNode port: 50010, complex main port: 5000, X server ports:
# 6000–6020, etc. Fewer or no reserved ports are found between 51500–65535.
# To avoid SELinux denial, make sure the port is unreserved or run the device in permissive mode.
#
# SERVER_ADDRESS and SERVER_PORT must be configured accordingly.
#
# Single SIM:
# Example: SERVER_ADDRESS=10.10.10.10
# This means use 10.10.10.10 as the server IP for the data call.
# Example: SERVER_PORT=51500
# This means use port 51500 for the data call.
#
# Multi-SIM:
# In case of multi-SIM, if a data call is expected on both SIMs, then the server address and port
# must be provided twice (comma-separated).
# Example: SERVER_ADDRESS=10.10.10.10,11.11.11.11
# This means use 10.10.10.10 for the data call on SIM 1 and 11.11.11.11 for SIM 2.
# Example: SERVER_PORT=51500,51501
# This means use port 51500 for SIM 1 and 51501 for SIM 2.
SERVER_ADDRESS=
SERVER_PORT=

[NTN_CONFIGS]
# By default telux_power_refd will be running in TN. Clients are requested to enable NTN mode by
# setting the config value to TRUE. NAOIP trigger is not allowed under NTN mode.
ENABLE_NTN=FALSE

# NTN enablement configurations.
# Emergency should be set to TRUE if the NTN connection supports emergency services,
# otherwise, set it to FALSE.
# Integrated Circuit Card Identification (ICCID) of the SIM to be used for NTN.
EMERGENCY=FALSE
ICCID=

# NTN SMS Send data configurations.
# IS_EMERGENCY_DATA indicates if this is emergency data. This parameter can be set to TRUE
# only if NTN is enabled with the Emergency parameter set to TRUE.
IS_EMERGENCY_DATA=FALSE